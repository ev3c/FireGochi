<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>FireGochi — Cuida tu fuego</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#120b07" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FireGochi" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="src/style.css?v=1.25" />
  <script>
    // Si el juego no llega a arrancar, lo dice en pantalla en vez de quedarse congelado.
    (function () {
      var errors = [];
      function show(extra) {
        if (window.__chimenea || document.getElementById('boot-error')) return;
        var en = (localStorage.getItem('firegochi-lang') || navigator.language || '').indexOf('en') === 0;
        var box = document.createElement('div');
        box.id = 'boot-error';
        box.style.cssText = 'position:fixed;inset:auto 12px 12px 12px;z-index:99;padding:14px 16px;border-radius:12px;background:rgba(60,14,8,.95);color:#f3e2cf;font:14px/1.45 system-ui,sans-serif;border:1px solid #ff9a3c';
        box.innerHTML = '<b>' + (en ? 'FireGochi could not start.' : 'FireGochi no ha podido arrancar.') + '</b><br>'
          + (en ? 'Reload the page. If it keeps happening, send this message:' : 'Recarga la página. Si sigue pasando, envía este mensaje:')
          + '<pre style="white-space:pre-wrap;margin:8px 0 10px;font-size:12px;opacity:.85"></pre>'
          + '<button type="button" style="padding:7px 12px;border-radius:8px;border:1px solid #ff9a3c;background:#5a2a10;color:#f3e2cf">' + (en ? 'Reload' : 'Recargar') + '</button>';
        box.querySelector('pre').textContent = (errors.concat(extra ? [extra] : []).join('\n') || 'timeout') + '\n' + navigator.userAgent;
        box.querySelector('button').onclick = function () { location.reload(); };
        document.body.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        var where = e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno + ')' : (e.target && e.target.src ? ' (' + e.target.src + ')' : '');
        errors.push((e.message || 'load error') + where);
        setTimeout(show, 300);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason)); setTimeout(show, 300); });
      window.addEventListener('load', function () { setTimeout(function () { show(); }, 10000); });
    })();
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud" class="panel">
    <div id="brand">
      <span class="brand-name">🔥 FireGochi <span class="ver">v1.25</span></span>
      <span id="lang-switch" class="lang-switch">
        <button type="button" class="lang-btn" data-lang="es" title="Español">ES</button>
        <button type="button" class="lang-btn" data-lang="en" title="English">EN</button>
      </span>
    </div>
    <div class="hud-top">
      <span id="mood">🥶</span>
      <div>
        <div class="lbl" data-i18n="hud.fire">Fuego</div>
        <div id="level">Apagado</div>
      </div>
      <div class="pts" data-i18n-title="hud.pointsTip" title="Puntos de calor"><span id="points">0</span> ✨</div>
    </div>
    <div class="bar-row"><span data-i18n="hud.flame">Llama</span><div class="bar"><i id="bar-fire"></i></div></div>
    <div class="bar-row"><span data-i18n="hud.air">Aire</span><div class="bar air"><i id="bar-air"></i></div></div>
    <div class="grid">
      <span data-i18n="hud.room">🏠 Sala</span><b id="room">—</b>
      <span data-i18n="hud.outside">🌙 Fuera</span><b id="outside">—</b>
      <span data-i18n="hud.alive">⏱️ Encendido</span><b id="alive">—</b>
      <span data-i18n="hud.best">🏅 Récord</span><b id="best">—</b>
    </div>
    <div id="world" hidden>
      <span class="world-lbl" data-i18n="hud.world">🌍 Mundial</span>
      <b id="world-time">—</b>
      <span id="world-name"></span>
    </div>
    <div id="speed">
      <button type="button" class="spd-btn" id="spd-down" data-i18n-title="hud.slower" title="Más lento">«</button>
      <span class="spd-mid"><span data-i18n="settings.time">Ritmo del tiempo</span> <b id="spd-val">x1</b></span>
      <button type="button" class="spd-btn" id="spd-up" data-i18n-title="hud.faster" title="Más rápido">»</button>
    </div>
  </div>

  <div id="status" class="panel"></div>

  <div id="topbar">
    <div class="topbar-row topbar-actions">
      <button class="btn" id="btn-garden" data-i18n-title="nav.gardenTip" title="Recoge leña gratis del jardín cada pocos minutos">🌲 Jardín</button>
      <button class="btn" id="btn-shop" data-i18n="nav.shop" data-i18n-title="nav.shopTip" title="Compra leña y cerillas con puntos de calor">🛒 Tienda</button>
    </div>
    <div class="topbar-row topbar-icons">
      <button class="btn" id="btn-ach" data-i18n-title="nav.achTip" title="Logros">🏆</button>
      <button class="btn" id="btn-help" data-i18n-title="nav.helpTip" title="Ayuda">❔</button>
      <button class="btn" id="btn-sound" data-i18n-title="nav.soundTip" title="Sonido">🔊</button>
      <button class="btn" id="btn-settings" data-i18n-title="nav.settingsTip" title="Ajustes">⚙️</button>
    </div>
  </div>

  <div id="bottom">
    <div id="hint"></div>
    <div id="toolbar" class="panel">
      <div id="tools"></div>
      <div class="sep"></div>
      <div id="inventory"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="tip"></div>

  <div id="modal">
    <div class="modal-card panel">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="btn">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <noscript>Este juego necesita JavaScript. This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js?v=1.25"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        const reg = await navigator.serviceWorker.register('sw.js?v=1.25');
        if (reg.waiting) reg.waiting.postMessage({ type: 'skip' });
        const sw = (await navigator.serviceWorker.ready).active;
        const urls = performance.getEntriesByType('resource').map((r) => r.name).filter((u) => u.startsWith(location.origin));
        sw?.postMessage({ type: 'cache', urls });
      });
    }
  </script>
</body>
</html>
