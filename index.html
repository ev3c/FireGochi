<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>FireGochi — Cuida tu fuego</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#120b07" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="FireGochi" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/",
        "cannon-es": "./vendor/cannon/cannon-es.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="hud" class="panel">
    <div id="brand">
      <span class="brand-name">🔥 FireGochi <span class="ver">v1.11</span></span>
      <span id="lang-switch" class="lang-switch">
        <button type="button" class="lang-btn" data-lang="es" title="Español">ES</button>
        <button type="button" class="lang-btn" data-lang="en" title="English">EN</button>
      </span>
    </div>
    <div class="hud-top">
      <span id="mood">🥶</span>
      <div>
        <div class="lbl" data-i18n="hud.fire">Fuego</div>
        <div id="level">Apagado</div>
      </div>
      <div class="pts" data-i18n-title="hud.pointsTip" title="Puntos de calor"><span id="points">0</span> ✨</div>
    </div>
    <div class="bar-row"><span data-i18n="hud.flame">Llama</span><div class="bar"><i id="bar-fire"></i></div></div>
    <div class="bar-row"><span data-i18n="hud.air">Aire</span><div class="bar air"><i id="bar-air"></i></div></div>
    <div class="grid">
      <span data-i18n="hud.room">🏠 Sala</span><b id="room">—</b>
      <span data-i18n="hud.outside">🌙 Fuera</span><b id="outside">—</b>
      <span data-i18n="hud.alive">⏱️ Encendido</span><b id="alive">—</b>
      <span data-i18n="hud.best">🏅 Récord</span><b id="best">—</b>
    </div>
    <div id="speed">
      <button type="button" class="spd-btn" id="spd-down" data-i18n-title="hud.slower" title="Más lento">«</button>
      <span class="spd-mid"><span data-i18n="settings.time">Ritmo del tiempo</span> <b id="spd-val">x1</b></span>
      <button type="button" class="spd-btn" id="spd-up" data-i18n-title="hud.faster" title="Más rápido">»</button>
    </div>
  </div>

  <div id="status" class="panel"></div>

  <div id="topbar">
    <div class="topbar-row topbar-actions">
      <button class="btn" id="btn-garden" data-i18n-title="nav.gardenTip" title="Recoge leña gratis del jardín cada pocos minutos">🌲 Jardín</button>
      <button class="btn" id="btn-shop" data-i18n="nav.shop" data-i18n-title="nav.shopTip" title="Compra leña y cerillas con puntos de calor">🛒 Tienda</button>
    </div>
    <div class="topbar-row topbar-icons">
      <button class="btn" id="btn-ach" data-i18n-title="nav.achTip" title="Logros">🏆</button>
      <button class="btn" id="btn-help" data-i18n-title="nav.helpTip" title="Ayuda">❔</button>
      <button class="btn" id="btn-sound" data-i18n-title="nav.soundTip" title="Sonido">🔊</button>
      <button class="btn" id="btn-settings" data-i18n-title="nav.settingsTip" title="Ajustes">⚙️</button>
    </div>
  </div>

  <div id="bottom">
    <div id="hint"></div>
    <div id="toolbar" class="panel">
      <div id="tools"></div>
      <div class="sep"></div>
      <div id="inventory"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="tip"></div>

  <div id="modal">
    <div class="modal-card panel">
      <div class="modal-head"><h3 id="modal-title"></h3><button id="modal-close" class="btn">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>

  <noscript>Este juego necesita JavaScript. This game needs JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        await navigator.serviceWorker.register('sw.js');
        const sw = (await navigator.serviceWorker.ready).active;
        const urls = performance.getEntriesByType('resource').map((r) => r.name).filter((u) => u.startsWith(location.origin));
        sw?.postMessage({ type: 'cache', urls });
      });
    }
  </script>
</body>
</html>
